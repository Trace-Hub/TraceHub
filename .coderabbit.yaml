#coderabbit.yaml

# ---------------------------------------------------------------- #
# AI 기본 설정 (언어 및 페르소나)
# ---------------------------------------------------------------- #
# AI 응답 시, 사용할 기본 언어를 설정 (예: ko-KR, en-US)
language: ko-KR

# AI의 페르소나와 응답 톤앤매너를 상세하게 지시
tone_instructions: >
  당신은 'TraceHub'의 코치입니다. 목표는 팀원들이 코드 품질을 개선하며 성장하도록 돕는 것입니다.
  1. 피드백은 명확하고 구체적이어야 하며, 문제의 원인과 개선 방법을 반드시 제시하세요.
  2. 리뷰는 교육적이어야 하며, 관련 개념이나 공식 문서를 함께 추천하세요.
  3. 비판보다는 개선 중심의 제안을 우선하세요.
  4. 칭찬은 짧고 위트 있게 작성하세요.

# ---------------------------------------------------------------- #
# 코드 리뷰 기능 세부 설정
# ---------------------------------------------------------------- #
reviews:
  # 리뷰 전반적인 스타일을 설정 - "chill"은 비교적 덜 엄격하고 부드러운 톤을 의미
  profile: chill
  # Code Rabbit 코멘트를 모두 "resolve"하면 자동으로 승인
  request_changes_workflow: false
  # PR 변경사항에 대한 고수준의 요약을 생성할지에 대한 여부
  high_level_summary: true
  # 변경된 파일에 대한 요약 생성 여부
  changed_files_summary: false
  # 코드 실행 흐름을 보여주는 시퀀스 다이어그램 생성 여부
  sequence_diagrams: false
  # PR에 연결된 이슈(Issue)를 분석하여 리뷰 컨텍스트에 활용할지 여부
  assess_linked_issues: true
  # 연관된 다른 이슈를 찾아서 링크할지 여부
  related_issues: false
  # 연관된 다른 PR을 찾아서 링크할지 여부
  related_prs: false
  # PR에 적절한 레이블(e.g., 'bug', 'enhancement')을 제안할지 여부
  suggested_labels: false
  # 제안된 레이블을 자동으로 PR에 적용할지 여부
  auto_apply_labels: false
  # 이 PR을 리뷰할 만한 적절한 동료 리뷰어를 추천할지 여부
  suggested_reviewers: false
  # 추천된 리뷰어를 자동으로 할당할지 여부
  auto_assign_reviewers: false
  # 리뷰 요약에 위트 있는 시(poem)를 포함할지 여부
  poem: false

  # ---------------------------------------------------------------- #
  # 자동 리뷰 트리거 설정
  # ---------------------------------------------------------------- #
  auto_review:
    # PR 생성 시, 자동으로 리뷰 시작
    enabled: true

    drafts: false
    base_branches:
      - main
      - develop
    # 기존 리뷰가 있는 PR에 새 커밋 추가 시, 변경 부분만 다시 리뷰
    auto_incremental_review: false

# ---------------------------------------------------------------- #
# 채팅 설정
# ---------------------------------------------------------------- #
chat:
  # @coderabbit 멘션 없이도 PR 코멘트에 자동으로 응답
  auto_reply: true


# ---------------------------------------------------------------- #
# 지식 베이스 설정
# ---------------------------------------------------------------- #
knowledge_base:
  # 리뷰 시 최신 문서나 정보를 웹에서 검색해 참고할 수 있도록 허용
  web_search:
    enabled: true

  # 레포에 코딩 컨벤션이나 가이드라인 문서가 있다면 리뷰에 반영
  code_guidelines:
    enabled: true